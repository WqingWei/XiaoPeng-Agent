services:
  - type: web
    name: xiaopeng-agent-backend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.backend
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: MODEL_NAME
        value: qwen3.8-max
      - key: MODEL_NAME_LITE
        value: qwen3.7-flash
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PERSISTENCE_REQUIRED
        value: true
